name: Build Signed Release APK & AAB

on:
  push:
    branches: [ "main", "master" ]
    tags:     [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:          # allow manual trigger from the Actions tab

jobs:
  build:
    name: Build signed release
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # -----------------------------------------------------------------------
      # 1. Check out the source code
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Set up JDK 17 (required for modern Android Gradle Plugin)
      # -----------------------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # -----------------------------------------------------------------------
      # 3. Decode the base64-encoded keystore stored in GitHub Secrets and
      #    write it to the path that app/build.gradle references.
      #
      #    Required repository secrets (Settings → Secrets and variables →
      #    Actions → New repository secret):
      #
      #      KEYSTORE_BASE64   – base64-encoded content of your .jks file
      #                          Generate with:
      #                            base64 -i app/my-release-key.jks | pbcopy   (macOS)
      #                            base64 app/my-release-key.jks | clip        (Windows Git Bash)
      #      KEYSTORE_PASSWORD – keystore password (storePassword)
      #      KEY_ALIAS         – key alias          (keyAlias)
      #      KEY_PASSWORD      – key password        (keyPassword)
      # -----------------------------------------------------------------------
      - name: Decode keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/my-release-key.jks

      # -----------------------------------------------------------------------
      # 4. Make Gradle wrapper executable
      # -----------------------------------------------------------------------
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # -----------------------------------------------------------------------
      # 5. Build the signed release APK
      #    Signing credentials are passed as env vars which app/build.gradle
      #    reads via System.getenv() when keystore.properties is absent.
      # -----------------------------------------------------------------------
      - name: Build signed release APK
        env:
          storeFile: app/my-release-key.jks
          storePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      # -----------------------------------------------------------------------
      # 6. Build the signed release AAB (Android App Bundle)
      # -----------------------------------------------------------------------
      - name: Build signed release AAB
        env:
          storeFile: app/my-release-key.jks
          storePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      # -----------------------------------------------------------------------
      # 7. Upload the signed APK as a workflow artifact
      # -----------------------------------------------------------------------
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # -----------------------------------------------------------------------
      # 8. Upload the signed AAB as a workflow artifact
      # -----------------------------------------------------------------------
      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
