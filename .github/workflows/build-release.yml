name: Build & Release Signed APK/AAB

on:
  push:
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0) — leave empty for a draft build'
        required: false
        default: ''

jobs:
  build:
    name: Build signed release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create GitHub Releases

    steps:
      # -----------------------------------------------------------------------
      # 1. Check out the source code
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Set up JDK 17 (required for modern Android Gradle Plugin)
      # -----------------------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # -----------------------------------------------------------------------
      # 3. Decode the base64-encoded keystore stored in GitHub Secrets and
      #    write it to app/my-release-key.jks — the path the signing config
      #    expects.
      #
      #    Required repository secrets (Settings → Secrets and variables →
      #    Actions → New repository secret):
      #
      #      KEYSTORE_BASE64   – base64-encoded content of your .jks file
      #                          Generate with:
      #                            base64 -w 0 app/my-release-key.jks   (Linux)
      #                            base64 -i app/my-release-key.jks     (macOS)
      #      KEYSTORE_PASSWORD – keystore password  (storePassword)
      #      KEY_ALIAS         – key alias           (keyAlias)
      #      KEY_PASSWORD      – key password         (keyPassword)
      # -----------------------------------------------------------------------
      - name: Decode keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/my-release-key.jks

      # -----------------------------------------------------------------------
      # 4. Make Gradle wrapper executable
      # -----------------------------------------------------------------------
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # -----------------------------------------------------------------------
      # 5. Build the signed release APK
      #    Signing credentials are passed as env vars which app/build.gradle
      #    reads via System.getenv() when keystore.properties is absent.
      # -----------------------------------------------------------------------
      - name: Build signed release APK
        env:
          storeFile: app/my-release-key.jks
          storePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      # -----------------------------------------------------------------------
      # 6. Build the signed release AAB (Android App Bundle)
      # -----------------------------------------------------------------------
      - name: Build signed release AAB
        env:
          storeFile: app/my-release-key.jks
          storePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      # -----------------------------------------------------------------------
      # 7. Rename artifacts to include the version tag
      # -----------------------------------------------------------------------
      - name: Rename artifacts
        run: |
          VERSION="${{ github.ref_name }}"
          if [[ "$VERSION" != v* ]]; then
            VERSION="${{ github.event.inputs.tag }}"
          fi
          if [[ -z "$VERSION" ]]; then
            VERSION="$(date +'%Y%m%d-%H%M%S')"
          fi
          echo "RELEASE_VERSION=$VERSION" >> $GITHUB_ENV

          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          AAB_SRC="app/build/outputs/bundle/release/app-release.aab"
          APK_DEST="app/build/outputs/apk/release/InvestmentIQ-${VERSION}.apk"
          AAB_DEST="app/build/outputs/bundle/release/InvestmentIQ-${VERSION}.aab"
          [ -f "$APK_SRC" ] && mv "$APK_SRC" "$APK_DEST" || true
          [ -f "$AAB_SRC" ] && mv "$AAB_SRC" "$AAB_DEST" || true

      # -----------------------------------------------------------------------
      # 8. Upload the signed APK as a workflow artifact (every build)
      # -----------------------------------------------------------------------
      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # -----------------------------------------------------------------------
      # 9. Upload the signed AAB as a workflow artifact (every build)
      # -----------------------------------------------------------------------
      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      # -----------------------------------------------------------------------
      # 10. Create a GitHub Release and attach the signed artifacts
      #     Only runs when the workflow is triggered by a version tag push
      #     or when a tag is supplied via workflow_dispatch.
      # -----------------------------------------------------------------------
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: Release ${{ env.RELEASE_VERSION }}
          body: |
            ## InvestmentIQ ${{ env.RELEASE_VERSION }}

            ### Downloads
            | File | Description |
            |------|-------------|
            | `*.apk` | Signed release APK — install directly on Android devices |
            | `*.aab` | Signed Android App Bundle — upload to Google Play Store |

            ### Installing the APK
            1. Download the `.apk` file to your Android device.
            2. Enable **Install from unknown sources** in device settings if prompted.
            3. Open the `.apk` file to install.

            ### Uploading to Google Play
            Upload the `.aab` file through the [Google Play Console](https://play.google.com/console).
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
