name: Build & Sign Release AAB

on:
  push:
    branches:
      - release
  workflow_dispatch:

jobs:
  build:
    name: Build signed release AAB
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Decode keystore from secret
        run: |
          mkdir -p "$HOME/keystores"
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode \
            > "$HOME/keystores/investment-assistant-release.jks"

      - name: Create gradle.properties with signing credentials
        run: |
          cat > gradle.properties <<EOF
          RELEASE_STORE_FILE=$HOME/keystores/investment-assistant-release.jks
          RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build release AAB
        run: ./gradlew bundleRelease

      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: investment-assistant-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
