name: Generate Keystore

on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: 'Key alias'
        required: false
        default: 'investment-assistant-key'
      validity_days:
        description: 'Validity in days'
        required: false
        default: '10000'
      common_name:
        description: 'Common Name (CN) — e.g. your name or app name'
        required: false
        default: 'Investment Assistant'
      organization:
        description: 'Organization name'
        required: false
        default: 'Investment Assistant'
      country:
        description: 'Two-letter country code'
        required: false
        default: 'US'

jobs:
  generate-keystore:
    name: Generate & Upload Keystore
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK (provides keytool)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate keystore
        env:
          KS_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:   ${{ github.event.inputs.key_alias }}
          VALIDITY:    ${{ github.event.inputs.validity_days }}
          CN:          ${{ github.event.inputs.common_name }}
          ORG:         ${{ github.event.inputs.organization }}
          COUNTRY:     ${{ github.event.inputs.country }}
        run: |
          # Use a random password if the secret is not configured
          if [ -z "$KS_PASSWORD" ]; then
            KS_PASSWORD="$(openssl rand -base64 18)"
            echo "::add-mask::$KS_PASSWORD"
            echo "::warning::KEYSTORE_PASSWORD secret not set — a random password was used. Store it safely."
            echo "Generated password (copy this now — it is masked in logs after this line):"
            echo "$KS_PASSWORD"
          fi

          keytool -genkeypair \
            -keystore investment-assistant.jks \
            -alias    "$KEY_ALIAS" \
            -keyalg   RSA \
            -keysize  4096 \
            -sigalg   SHA256withRSA \
            -validity "$VALIDITY" \
            -dname    "CN=${CN}, OU=Mobile, O=${ORG}, L=Unknown, ST=Unknown, C=${COUNTRY}" \
            -storepass "$KS_PASSWORD" \
            -keypass   "$KS_PASSWORD"

          echo "Keystore generated successfully."

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: investment-assistant-keystore
          path: investment-assistant.jks
          # Artifact expires after 7 days — download it promptly and store securely
          retention-days: 7
